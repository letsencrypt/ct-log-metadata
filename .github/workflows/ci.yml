name: Linting

on: [push, pull_request]

permissions:
  contents: read

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: 3.14

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install --user pylint==4.0.8
        pip install --user black==26.5.1
        pip install --user flake8==7.3.0
        pip install --user zizmor==1.30.1

    - name: Analysing the code with pylint
      run: |
        python -m pylint -E .

    - name: Checking format with Black
      run: |
        python -m black --check .

    - name: Checking format with Flake8
      run: |
        python -m flake8 .

    - name: Checking workflows with zizmor
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        zizmor .github/workflows

  validate-bundles:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: 3.14

    - name: Build bundles
      run: |
        ./build_bundle.py -o bundle-production.pem
        ./build_bundle.py --testing -o bundle-testing.pem

    - name: Validate bundles
      run: ./validate-bundles.sh bundle-production.pem bundle-testing.pem

