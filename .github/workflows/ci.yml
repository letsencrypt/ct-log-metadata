name: Linting

on: [push, pull_request]

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: 3.14

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install --user pylint==4.0.8
        pip install --user black==26.5.1
        pip install --user flake8==7.3.0

    - name: Analysing the code with pylint
      run: |
        python -m pylint -E .

    - name: Checking format with Black
      run: |
        python -m black --check .

    - name: Checking format with Flake8
      run: |
        python -m flake8 .

  validate-bundles:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: 3.14

    - name: Build bundles
      run: |
        ./build_bundle.py -o bundle-production.pem
        ./build_bundle.py --testing -o bundle-testing.pem

    - name: Validate bundles
      run: ./validate-bundles.sh bundle-production.pem bundle-testing.pem

